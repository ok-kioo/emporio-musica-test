[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
rag = [
    "chromadb>=0.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = [
    "llm: usa uma API real de LLM; requer chave e pode gerar custo",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]
